<!DOCTYPE html>
<html lang="nb" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ef" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cinema Info" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Buen kino – program, tider, solgte billetter og innslipp" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cinema Info" />
    <meta property="og:description" content="Program, tider og solgte billetter for Buen kino" />
    <meta property="og:url" content="https://t3lluz.github.io/Cinema-Info/" />
    <meta property="og:image" content="https://t3lluz.github.io/Cinema-Info/assets/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Buen kino</title>
    <link rel="preconnect" href="https://api.dx.no" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="stylesheet" href="css/styles.css?v=dev" />
    <script>
      // Paint the saved theme before the first frame, so a dark visitor
      // never sees a light flash. "system"/unset follows the device.
      try {
        var p = JSON.parse(localStorage.getItem("cinemaInfoPrefs") || "{}");
        var dark =
          p.theme === "dark" ||
          (p.theme !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0c0c0e" : "#f4f2ef";
        if (p.lang === "en") document.documentElement.lang = "en";
      } catch (e) {}
    </script>
    <link rel="modulepreload" href="js/i18n.js?v=dev" />
    <link rel="modulepreload" href="js/core.js?v=dev" />
    <link rel="modulepreload" href="js/data.js?v=dev" />
    <link rel="modulepreload" href="js/ui.js?v=dev" />
    <link rel="modulepreload" href="js/seats.js?v=dev" />
    <link rel="modulepreload" href="js/day.js?v=dev" />
    <link rel="modulepreload" href="js/movies.js?v=dev" />
    <link rel="modulepreload" href="js/stats.js?v=dev" />
    <link rel="modulepreload" href="js/settings.js?v=dev" />
    <link rel="modulepreload" href="js/sheet.js?v=dev" />
    <link rel="modulepreload" href="js/ripple.js?v=dev" />
  </head>
  <body data-tab="day">
    <div id="app" class="app">
      <!-- One sheet of glass behind the header and whatever bar is docked
           under it, so they read as a single panel. -->
      <div id="headerGlass" class="header-glass" aria-hidden="true"></div>
      <header id="appbar" class="appbar">
        <div class="appbar-row">
          <div class="brand">
            <img class="brand-mark" src="assets/favicon.svg" alt="" width="30" height="30" />
            <span class="brand-name">Buen kino</span>
          </div>
          <button id="statusBtn" class="status-btn" type="button" data-kind="loading" aria-label="Oppdater">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText" class="status-text">Henter…</span>
            <svg class="icon status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </div>
      </header>

      <!-- The warning sits right under the header on every tab and scrolls
           away; the day strip below it sticks under the header on its own. -->
      <section id="notice" class="notice pull-follow" role="note" aria-label="Advarsel" hidden></section>

      <div id="dayDock" class="day-dock pull-follow">
        <div id="dayBar" class="day-bar">
          <button id="jumpTodayBtn" class="jump-today" type="button" tabindex="-1" aria-hidden="true" data-i18n-aria="jumpTodayAria" aria-label="Gå til i dag">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span data-i18n="jumpToday">I dag</span>
          </button>
          <div class="hs hs-days" data-hs>
            <button type="button" class="hs-btn hs-prev" data-hs-dir="-1" data-i18n-aria="scrollPrev" aria-label="Rull til venstre">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button type="button" class="hs-btn hs-next" data-hs-dir="1" data-i18n-aria="scrollNext" aria-label="Rull til høyre">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <div id="dayTabs" class="day-strip" data-hs-track role="tablist" data-i18n-aria="chooseDay" aria-label="Velg dag"></div>
          </div>
        </div>
      </div>

      <main class="main pull-follow">
        <section id="view-day" class="view view-day" aria-live="polite">
          <div id="pager" class="pager">
            <div id="dayPage" class="page">
              <div class="card skeleton-card is-hero" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="day-shows" aria-hidden="true">
                <div class="card skeleton-card is-short"><i></i><i></i></div>
                <div class="card skeleton-card is-short"><i></i><i></i></div>
              </div>
            </div>
            <div id="dayGhost" class="page is-ghost" hidden aria-hidden="true"></div>
          </div>
        </section>

        <section id="view-movies" class="view view-movies" hidden>
          <div class="page">
            <div id="moviesHead"></div>
            <div class="search" role="search">
              <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
              <input
                id="searchInput"
                type="search"
                enterkeyhint="search"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                maxlength="100"
                data-i18n-placeholder="searchPlaceholder"
                placeholder="Søk film, dag eller klokkeslett…"
                data-i18n-aria="searchAria"
                aria-label="Søk etter film, dag eller klokkeslett på Buen"
                aria-controls="searchResults"
                aria-expanded="false"
              />
              <button id="searchClear" class="search-clear" type="button" hidden data-i18n-aria="searchClear" aria-label="Tøm søk">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div id="searchResults" class="search-results" hidden></div>
            <div id="moviesBody"></div>
          </div>
        </section>

        <section id="view-stats" class="view view-stats" hidden>
          <div id="statsContent" class="page"></div>
        </section>

        <section id="view-settings" class="view view-settings" hidden>
          <div id="settingsContent" class="page"></div>
        </section>
      </main>

      <nav id="tabbar" class="tabbar" data-i18n-aria="nav.aria" aria-label="Hovedmeny">
        <div class="tabbar-inner" role="tablist">
          <span class="tab-indicator" aria-hidden="true"></span>
          <button type="button" class="tab" role="tab" data-tab="day" aria-selected="true" aria-controls="view-day">
            <svg class="icon nav-icon ni-day" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="ni-fill" x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18"/><path class="ni-rings" d="M8 2.5v4M16 2.5v4"/><path class="ni-date" d="M7.5 13.5h3v3h-3z"/></svg>
            <span class="tab-label" data-i18n="nav.day">Dager</span>
          </button>
          <button type="button" class="tab" role="tab" data-tab="movies" aria-selected="false" aria-controls="view-movies">
            <svg class="icon nav-icon ni-movies" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ni-fill" d="M4 11v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8H4Z"/><g class="ni-clap"><path class="ni-fill" d="m4 11-.9-2.9a2 2 0 0 1 1.3-2.5L16 2.1a2 2 0 0 1 2.5 1.3l.9 2.9L4 11Z"/><path d="m6.6 5 3.4 4.2M11.9 3.4l3.3 4.2"/></g></svg>
            <span class="tab-label" data-i18n="nav.movies">Filmer</span>
          </button>
          <button type="button" class="tab" role="tab" data-tab="stats" aria-selected="false" aria-controls="view-stats">
            <svg class="icon nav-icon ni-stats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path class="ni-bar ni-b1" d="M8 17v-4"/><path class="ni-bar ni-b2" d="M13 17V8"/><path class="ni-bar ni-b3" d="M18 17v-7"/></svg>
            <span class="tab-label" data-i18n="nav.stats">Statistikk</span>
          </button>
          <button type="button" class="tab" role="tab" data-tab="settings" aria-selected="false" aria-controls="view-settings">
            <svg class="icon nav-icon ni-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ni-gear"><path class="ni-fill" d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle class="ni-hub" cx="12" cy="12" r="3"/></g></svg>
            <span class="tab-label" data-i18n="nav.settings">Innstillinger</span>
          </button>
        </div>
      </nav>
    </div>

    <div id="sheet" class="sheet" hidden>
      <button type="button" class="sheet-backdrop" data-sheet-close tabindex="-1" data-i18n-aria="sheetClose" aria-label="Lukk"></button>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-grab" aria-hidden="true"><span></span></div>
        <button type="button" class="sheet-close" data-sheet-close data-i18n-aria="sheetClose" aria-label="Lukk">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- The progressive blur the page fades into behind the tab bar. -->
    <div class="edge-blur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

    <!-- Server endpoints, all on t3lluz.com/CinemaInfo/api (server/main.ts):
         the DX bridge, film lookups, the prefetched live feed and staff
         feedback. Served from t3lluz.com they are same-origin; from GitHub
         Pages or the dev server they are cross-origin calls to the same
         place. Without this block the app falls back to the Supabase Edge
         Functions and reads DX per showing. Details: deploy/server/README.md. -->
    <script>
      (() => {
        const api =
          location.hostname === "t3lluz.com"
            ? `${location.origin}/CinemaInfo/api`
            : "https://t3lluz.com/CinemaInfo/api";
        window.CINEMA_INFO_BRIDGE = {
          dxWebLogin: `${api}/dx`,
          omdbLookup: `${api}/omdb`,
          live: `${api}/live`,
          feedback: `${api}/feedback`,
        };
      })();
    </script>
    <script src="js/app.js?v=dev" type="module"></script>
  </body>
</html>
