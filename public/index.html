<!DOCTYPE html>
<html lang="nb" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#efece8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Buen kino – program, tider og solgte billetter" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Buen kino" />
    <meta property="og:description" content="Program, tider og solgte billetter for Buen kino" />
    <meta property="og:url" content="https://t3lluz.github.io/Cinema-Info/" />
    <meta property="og:image" content="https://t3lluz.github.io/Cinema-Info/assets/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Buen kino</title>
    <link rel="stylesheet" href="css/styles.css?v=134" />
    <script>
      // Paint the saved theme before the first frame, so a dark visitor
      // never sees a light flash. "system"/unset follows the device.
      try {
        var p = JSON.parse(localStorage.getItem("cinemaInfoPrefs") || "{}");
        var theme =
          p.theme === "dark" || p.theme === "light"
            ? p.theme
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        delete document.documentElement.dataset.material;
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.content = theme === "dark" ? "#121212" : "#efece8";
        if (p.lang === "en") document.documentElement.lang = "en";
      } catch (e) {}
    </script>
  </head>
  <body data-tab="day">
    <!-- Liquid-glass lenses: app.js draws a displacement map matching
         each element's exact size and corner radius onto these filters,
         so Chromium refracts the backdrop at the rim like curved glass.
         Safari/Firefox fall back to the plain blur declared first in
         CSS. Scale stays 0 (no-op) until the map is drawn. -->
    <svg class="liquid-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="lens-chip" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage result="map" preserveAspectRatio="none" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="lens-chip-rim" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage result="map" preserveAspectRatio="none" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <header class="top app-header">
      <div class="header-fade" aria-hidden="true">
        <div class="header-frost">
          <div class="header-frost-dots"></div>
        </div>
        <div class="header-glass"></div>
      </div>
      <div class="header-top">
        <div class="top-row">
          <div class="brand">
            <img class="brand-mark" src="assets/favicon.svg" alt="" width="28" height="28" />
            <h1>Buen kino</h1>
          </div>
          <div class="top-actions">
            <p id="statusText" class="status">—</p>
            <button id="refreshBtn" class="icon-btn" type="button" aria-label="Oppdater">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="timeline" class="timeline" hidden></div>

        <div id="dayControls" class="day-controls">
          <div class="day-controls-body">
            <button
              id="jumpTodayBtn"
              class="jump-today"
              type="button"
              hidden
              aria-label="Gå til i dag"
            >
              <span class="jump-today-arrow" aria-hidden="true">‹</span>
              <span data-i18n="today">I dag</span>
            </button>
            <div id="dayTabs" class="day-tabs" role="tablist" aria-label="Velg dag"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section id="view-day" class="view" data-view="day" aria-live="polite">
        <div id="daySwipe" class="day-swipe">
          <div id="dayPanePrev" class="content day-pane prev no-anim" aria-hidden="true"></div>
          <div id="content" class="content">
            <div class="state loading">
              <div class="spinner" aria-hidden="true"></div>
              <p data-i18n="loading">Henter program…</p>
            </div>
          </div>
          <div id="dayPaneNext" class="content day-pane next no-anim" aria-hidden="true"></div>
        </div>
      </section>

      <section id="view-movies" class="view" data-view="movies" hidden>
        <div id="moviesContent" class="content movies-content"></div>
      </section>

      <section id="view-stats" class="view" data-view="stats" hidden>
        <div id="statsContent" class="content stats-content"></div>
      </section>

      <section id="view-settings" class="view" data-view="settings" hidden>
        <div id="settingsContent" class="content settings-content"></div>
      </section>
    </main>

    <nav class="pill-nav" aria-label="Hovedmeny">
      <!-- Dotted frost plate + selection pebble + tabs as siblings, so
           each backdrop-filter samples the page behind it. -->
      <div class="pill-nav-shell">
        <div class="nav-dots" aria-hidden="true">
          <div class="nav-frost">
            <div class="nav-frost-dots"></div>
          </div>
          <div class="nav-glass"></div>
        </div>
        <div class="pill-indicator-track" aria-hidden="true">
          <div class="pill-lens">
            <span class="pill-indicator"></span>
            <span class="pill-indicator-rim"></span>
          </div>
        </div>
        <div class="pill-nav-inner" role="tablist">
          <button type="button" class="pill-tab" data-tab="day" role="tab" aria-selected="true" aria-controls="view-day">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 16H5V10h14v10Zm0-12H5V6h14v2ZM7 12h5v5H7v-5Z" />
            </svg>
            <span class="pill-tab-label" data-i18n="nav.day">Dager</span>
          </button>
          <button type="button" class="pill-tab" data-tab="movies" role="tab" aria-selected="false" aria-controls="view-movies">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4Z" />
            </svg>
            <span class="pill-tab-label" data-i18n="nav.movies">Filmer</span>
          </button>
          <button type="button" class="pill-tab" data-tab="stats" role="tab" aria-selected="false" aria-controls="view-stats">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M5 9.2h3V19H5V9.2ZM10.6 5h2.8v14h-2.8V5Zm5.6 8H19v6h-2.8v-6Z" />
            </svg>
            <span class="pill-tab-label" data-i18n="nav.stats">Statistikk</span>
          </button>
          <button type="button" class="pill-tab" data-tab="settings" role="tab" aria-selected="false" aria-controls="view-settings">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.1 7.1 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.9 2h-3.8a.49.49 0 0 0-.48.41l-.36 2.54c-.6.24-1.14.55-1.63.94l-2.39-.96a.49.49 0 0 0-.59.22L2.73 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54c.05.24.24.41.48.41h3.8c.24 0 .44-.17.49-.41l.36-2.54c.6-.24 1.14-.55 1.63-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z" />
            </svg>
            <span class="pill-tab-label" data-i18n="nav.settings">Innstillinger</span>
          </button>
        </div>
      </div>
    </nav>

    <script src="js/app.js?v=103" type="module"></script>
  </body>
</html>
