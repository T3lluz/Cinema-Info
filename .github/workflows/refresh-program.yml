name: Refresh program snapshot

# Buen's program API drops a show as soon as it starts, and the fetch
# script re-checks only the last two weeks of those against DX. If nobody
# runs it for longer than that, those days are gone for good — and with
# them the DX event ids the app needs to look up who scanned their
# ticket. Running nightly keeps the 120-day history accumulating on its
# own.
#
# The midday run is about the programme rather than history: a film added
# or moved during office hours should be in the app the same afternoon,
# not the next morning. Films *removed* need no waiting — the app asks DX
# about each showing and drops one whose event is gone.

on:
  schedule:
    # 01:10 Europe/Oslo (after the last show of the evening has ended).
    - cron: "10 23 * * *"
    # 13:10 Europe/Oslo, before the first showing of the afternoon.
    - cron: "10 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-program
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check OMDB_API_KEY
        env:
          # Repository Actions secret (preferred) or Actions variable of
          # the same name — people sometimes add the key under Variables.
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY || vars.OMDB_API_KEY }}
        run: |
          if [ -n "$OMDB_API_KEY" ]; then
            echo "OMDB_API_KEY is set (${#OMDB_API_KEY} chars)."
          else
            echo "::warning::OMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions (repository secret named OMDB_API_KEY). IMDb will still be fetched via direct IMDb GraphQL until then."
          fi

      - name: Fetch program + live ticket data
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY || vars.OMDB_API_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit when the snapshot changed
        run: |
          if git diff --quiet -- public/data/program.json; then
            echo "No program changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/program.json
          git commit -m "Refresh program snapshot"
          git push
