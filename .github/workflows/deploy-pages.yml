name: Redirect GitHub Pages

# Cinema Info lives at https://t3lluz.com/CinemaInfo/ only
# (deploy/server/update.sh publishes it there). GitHub Pages used to
# carry a second copy; it now serves deploy/pages-redirect/ instead: a
# page that forwards to the new address, and a service worker that
# clears the old install off phones that still have it.
#
# It only needs to run when that folder changes.

on:
  push:
    branches: [main]
    paths:
      - deploy/pages-redirect/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
