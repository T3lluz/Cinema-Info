name: Deploy GitHub Pages

# Static site deploy via Actions (avoids the legacy "Deploy from a branch"
# pipeline, which has been stuck in deployment_queued).
#
# One-time setup (repo admin): Settings → Pages → Build and deployment
# → Source: GitHub Actions. After that, every push to main publishes.
# Until that switch is made, this workflow builds the artifact but
# deploy-pages cannot publish (and the legacy pages-build-deployment
# job may still run in parallel).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at workflow level; the deploy job elevates below.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Only the PWA surface — public/, not scripts/, supabase/, .github/, etc.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -a public/. _site/
          node scripts/stamp-version.mjs _site "${GITHUB_SHA::7}"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
